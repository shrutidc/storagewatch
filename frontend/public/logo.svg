<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="StorageWatch">
  <!-- A solid-state drive in neon on a dark tile, drawn in the spirit of the
       menu bar's drive icon: a case seen from slightly above, with a vent row
       and a status light on its front. Original artwork — SF Symbols may not
       be used in logos. -->
  <defs>
    <radialGradient id="sw-tile" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#241552"/>
      <stop offset="1" stop-color="#0a0718"/>
    </radialGradient>
    <!-- In user space: a gradient sized to each shape's own box renders nothing
         on a perfectly straight line, whose box has no width or height. -->
    <linearGradient id="sw-neon" gradientUnits="userSpaceOnUse" x1="12" y1="18" x2="52" y2="46">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="sw-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <g id="sw-drive" stroke="url(#sw-neon)" stroke-linejoin="round" stroke-linecap="round">
      <path d="M19.5 19.5 H44.5 L51 30.5 H13 Z" stroke-width="3"/>
      <rect x="13" y="30.5" width="38" height="14" rx="3.5" stroke-width="3"/>
      <g stroke-width="2.4">
        <line x1="18.5" y1="34.8" x2="18.5" y2="40.2"/>
        <line x1="22.7" y1="34.8" x2="22.7" y2="40.2"/>
        <line x1="26.9" y1="34.8" x2="26.9" y2="40.2"/>
        <line x1="31.1" y1="34.8" x2="31.1" y2="40.2"/>
        <line x1="35.3" y1="34.8" x2="35.3" y2="40.2"/>
      </g>
    </g>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#sw-tile)"/>

  <!-- Glow behind, then the drive itself with faint glass faces -->
  <use href="#sw-drive" fill="none" opacity="0.85" filter="url(#sw-glow)"/>
  <path d="M19.5 19.5 H44.5 L51 30.5 H13 Z" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="13" y="30.5" width="38" height="14" rx="3.5" fill="#ffffff" fill-opacity="0.05"/>
  <use href="#sw-drive" fill="none"/>

  <!-- Status light -->
  <circle cx="45" cy="37.5" r="3" fill="#22d3ee" opacity="0.6" filter="url(#sw-glow)"/>
  <circle cx="45" cy="37.5" r="2.3" fill="#67e8f9"/>
</svg>
